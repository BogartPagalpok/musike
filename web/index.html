<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C0F" />
    <meta name="description" content="Your music, uninterrupted." />
    <meta name="author" content="Ian Lester Eclevia" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Illusive Sounds" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Illusive Sounds</title>
    <script>
      try {
        var themes = {
          dark: "#0b0c0f",
          light: "#e9ebef",
          oled: "#000000",
          midnight: "#070b14",
          rose: "#130a12",
          forest: "#07110d",
          sunset: "#140d0a",
          nord: "#1e222a",
          cream: "#f2ece1"
        };
        var t = localStorage.getItem("musike:theme");
        if (t && themes[t]) {
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", themes[t]);
        }
        // Before the app loads, so screen readers and the browser see the chosen language right away.
        var l = localStorage.getItem("musike:lang");
        if (l === "en" || l === "pt-BR") document.documentElement.lang = l;
        // Appearance chosen in Settings, applied before the first paint.
        var css = localStorage.getItem("musike:accent-css");
        if (css) {
          var s = document.createElement("style");
          s.id = "musike-accent";
          s.textContent = css;
          document.head.appendChild(s);
        }
        var a = JSON.parse(localStorage.getItem("musike:appearance") || "{}");
        if (a.compactSidebar === true) document.documentElement.dataset.rail = "compact";
        if (a.texture === false) document.documentElement.dataset.texture = "off";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
